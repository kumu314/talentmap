<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="天赋星图">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3c14b" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#f3c14b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f3c14b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="50%" stop-color="#f3c14b"/>
      <stop offset="100%" stop-color="#c9962f"/>
    </linearGradient>
  </defs>
  <!-- 柔光底 -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
  <!-- 星图轨道 -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#f3c14b" stroke-opacity="0.42" stroke-width="1.4"/>
  <!-- 轨道上的伴星（星座坐标） -->
  <path d="M48 12.8 L49.3 14.7 L51.2 16 L49.3 17.3 L48 19.2 L46.7 17.3 L44.8 16 L46.7 14.7 Z" fill="#ffe9a8" opacity="0.9"/>
  <path d="M16 44.8 L17.3 46.7 L19.2 48 L17.3 49.3 L16 51.2 L14.7 49.3 L12.8 48 L14.7 46.7 Z" fill="#ffe9a8" opacity="0.8"/>
  <!-- 主星：四角北辰星 -->
  <path d="M32 6 L37 27 L58 32 L37 37 L32 58 L27 37 L6 32 L27 27 Z" fill="url(#gold)" stroke="#fff3d0" stroke-opacity="0.5" stroke-width="0.6"/>
  <circle cx="32" cy="32" r="3.2" fill="#fff7e0"/>
</svg>
