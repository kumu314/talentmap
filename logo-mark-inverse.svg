<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="天赋星图（浅色背景用）">
  <defs>
    <radialGradient id="dglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b2547" stop-opacity="1"/>
      <stop offset="72%" stop-color="#0c1226" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0f20" stop-opacity="1"/>
