<script>
/* ===================== 题库 ===================== */
/* 维度累加：RIASEC(R/I/A/S/E/C)、VIA(优势名)、心流信号、能量(充电/耗尽)、五信号(sig_*) */

/* —— A2：回看过去（引导式回忆 · 用「点选」帮用户想起，而非逼ta硬想）—— */
/* 三件小事，每件事分 步：时间 → 场景 → 认领感觉（多选）→ 补充一句（可选） */
const RECALL_ITEMS = [
  {tag:'全心投入', lead:'回想一个你曾<span class="hl">全心全意投入</span>的时刻——哪怕很小。',
   hint:'是那种你做着做着，抬头发现时间过了好久的事。'},
  {tag:'做完充电', lead:'再想一个：你做完不是累，而是<span class="hl">踏实 / 满足 / 还想再来</span>的事。',
   hint:'是那种「消耗」完反而像充了电的事。'},
  {tag:'小高光', lead:'还有一个：你被夸、或自己暗暗得意<span class="hl">「这事儿我居然行」</span>的瞬间。',
   hint:'不是大成就，是那个让你有点意外「我还能这样」的小高光。'}
];
const RECALL_STEPS = {
  time:{q:'大概是什么时候的事？', multi:false, opts:[
    '很小的时候（中小学以前）','学生时代（中小学 / 大学）','刚工作 / 不久前','就是最近这半年','记不清哪年，但记得那件事']},
  scene:{q:'当时，你大概在什么状态里？', multi:false, opts:[
    '一个人，安静地做','和一两个人在一起','一群人当中','动手做某件具体的事','学东西 / 钻研什么','帮谁、照顾谁']},
  cue:{q:'下面哪几句，最像你那会儿的感觉？', multi:true, opts:[
    '忘了时间，抬头发现天都黑了','不在乎有没有人看，自己就想做',
    '做完不累，反而心里很踏实','有点上头，还想再来一次',
    '被夸了，或者自己偷偷得意','哪怕重来，我还会选做它']}

const GATE1 = [
  {gate:1, q:"周六一整天没人找你，你最可能会——", why:"空闲时自发去做的事，比「应该做」更诚实——这是兴趣最可靠的自发动机信号。", opts:[

  {gate:1, q:"选一门选修课，你眼睛亮的是——", why:"对哪类知识天然好奇，直接对应霍兰德兴趣的 R/I/A/S/E/C 代码。", opts:[

    {t:"哲学/天文/心理学", s:{I:1}, tag:""},

    localStorage.setItem(PROGRESS_KEY, JSON.stringify({
      phase, idx, currentGate,
      scores:JSON.parse(JSON.stringify(scores)), ikigai:JSON.parse(JSON.stringify(ikigai)),
      past:JSON.parse(JSON.stringify(past)), recallDone,
      history:JSON.parse(JSON.stringify(history)),
      recallStepIdx, recallStepKey, recallSel:JSON.parse(JSON.stringify(recallSel)),
      recallNotes:JSON.parse(JSON.stringify(recallNotes)), recallHistory:JSON.parse(JSON.stringify(recallHistory))
    }));
  }catch(e){}
}
function clearProgress(){ try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){} }
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)); }catch(e){ return null; } }
function restoreProgress(s){
  for(const k in scores) delete scores[k];
  Object.assign(scores, s.scores||{});
  for(const k in ikigai) delete ikigai[k];
  Object.assign(ikigai, s.ikigai||{});
  idx=s.idx||0; currentGate=s.currentGate||0;
  past=Array.isArray(s.past)?s.past.slice():[];
  recallDone=!!s.recallDone;
  history=Array.isArray(s.history)?s.history.slice():[];
  recallStepIdx=s.recallStepIdx||0; recallStepKey=s.recallStepKey||'time';
  recallSel=Object.assign({time:null,scene:null,cues:[],note:''}, s.recallSel||{});
  recallNotes=Array.isArray(s.recallNotes)?s.recallNotes.slice():[];
  recallHistory=Array.isArray(s.recallHistory)?s.recallHistory.slice():[];
}

/* —— A2：引导式回忆状态机（用「点选」帮用户想起，而非逼ta硬想） —— */
let recallStepIdx=0, recallStepKey='time';
let recallSel={time:null,scene:null,cues:[],note:''};
let recallNotes=[];
function buildPastNote(item, sel){
  const time = sel.time? (sel.time+'，') : '';
  const scene = sel.scene? ('在'+sel.scene+'，') : '';
  const cues = sel.cues.length? ('「'+sel.cues.join('、')+'」') : '';
  const note = sel.note? ('—— '+sel.note) : '';
  const s = (time+scene+cues+note).replace(/^\s*——\s*|\s+$/g,'');
  return s.trim()? (item.tag+'：'+s) : null;
}
function renderRecall(){
  recallStepIdx=0; recallStepKey='time';
  recallSel={time:null,scene:null,cues:[],note:''}; recallNotes=[]; recallHistory=[];
  plabel.textContent='第 0 关 · 先让记忆开口';
  bar.style.width='0%';
  stage.innerHTML=`
    <div class="recall">
      <div class="rno">第 0 关 · 回望</div>
      <h2>在测之前，先听你自己的</h2>
      <div class="rsub">天赋不是被「测」出来的，是曾被你活过的。我们换个轻松的方式——不用硬想，<span class="hl">点着点着，它就自己浮出来了</span>。</div>
      <div class="rnote">3 件小事，每件事 3 步选择题，几十秒就好。留白也行，但留下来它们会在你的报告里重新亮起。<br/>不管你擅长的事看起来多冷门、多「暂时没用」，这里识别的都是你做事时的<span class="hl">模式</span>（兴趣 / 优势 / 心流）。模式有限，技能无限。</div>
      <div style="text-align:center;margin-top:26px">
        <button class="btn btn-primary" id="startRecall">开始回想 →</button>
      </div>
    </div>`;
  document.getElementById('startRecall').onclick=renderRecallStep;
}
function renderRecallStep(){
  saveProgress('recall-step');
  const item=RECALL_ITEMS[recallStepIdx];
  const step=RECALL_STEPS[recallStepKey];
  const order=['time','scene','cue','note'];
  const si=order.indexOf(recallStepKey);
  bar.style.width=((recallStepIdx*4+si)/(RECALL_ITEMS.length*4)*100)+'%';
  plabel.textContent=`回想 ${recallStepIdx+1} / ${RECALL_ITEMS.length} · 第 ${si+1} / 4 步`;
  if(recallStepKey==='note'){
    stage.innerHTML=`
      <div class="recall">
        <div class="rno">第 ${recallStepIdx+1} 件 · ${item.tag}</div>
        <h2>${item.hint}</h2>
        <div class="rsub">想补一句当时做了什么吗？<span class="hl">可跳过</span>。</div>
        <textarea id="rnote" placeholder="可选，例如：高三晚自习后偷偷写小说，写到熄灯还舍不得停">${recallSel.note||''}</textarea>
        <div class="ropt-tip">不写也完全 OK，前面点过的已经够用了。</div>
        <div class="prev-row"><button class="btn btn-ghost" id="prevBtnRecall">← 上一步</button></div>
        <div style="text-align:center;margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-ghost" id="skipNote">跳过</button>
          <button class="btn btn-primary" id="nextNote">下一步 →</button>
        </div>
      </div>`;
    const pushRecallHistory=()=>recallHistory.push({idx:recallStepIdx,key:'note',sel:JSON.parse(JSON.stringify(recallSel))});
    document.getElementById('skipNote').onclick=()=>{ pushRecallHistory(); finishRecallStep(); };
    document.getElementById('nextNote').onclick=()=>{ recallSel.note=document.getElementById('rnote').value.trim(); pushRecallHistory(); finishRecallStep(); };
    document.getElementById('prevBtnRecall').onclick=goBackRecall;
    return;
  }
  const isMulti=step.multi;
  const optsHtml=step.opts.map((o,i)=>{
    const sel = isMulti ? recallSel.cues.includes(o) : recallSel[recallStepKey]===o;
    return `<button class="opt ${sel?'sel':''}" data-o="${i}">${o}</button>`;
  }).join('');
  const prevBtnHtml = `<div class="prev-row"><button class="btn btn-ghost" id="prevBtnRecall">← 上一步</button></div>`;
  const nextBtn = recallStepKey==='cue'
    ? `${prevBtnHtml}<div style="text-align:center;margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
         <button class="btn btn-ghost" id="skipCue">都不太像，跳过</button>
         <button class="btn btn-primary" id="nextStep">下一步 →</button>
       </div>`
    : `${prevBtnHtml}<div style="text-align:center;margin-top:12px">
         <button class="btn btn-primary" id="nextStep" disabled style="opacity:.45;cursor:not-allowed">选一个，下一步 →</button>
       </div>`;
  stage.innerHTML=`
    <div class="recall">
      <div class="rno">第 ${recallStepIdx+1} 件 · ${item.tag}</div>
      <h2>${step.q}</h2>
      <div class="ropt-tip">${isMulti?'（可多选，没有就点「跳过」）':''}</div>
      <div class="opts">${optsHtml}</div>
      ${nextBtn}
    </div>`;
  stage.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const o=step.opts[+b.dataset.o];
      if(isMulti){
        if(recallSel.cues.includes(o)){ recallSel.cues=recallSel.cues.filter(x=>x!==o); b.classList.remove('sel'); }
        else { recallSel.cues.push(o); b.classList.add('sel'); }
      } else {
        recallSel[recallStepKey]=o;
        stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        const nb=document.getElementById('nextStep'); nb.disabled=false; nb.style.opacity='1'; nb.style.cursor='pointer';
      }
    };
  });
  const ns=document.getElementById('nextStep');
  if(ns) ns.onclick=()=>{
    recallHistory.push({idx:recallStepIdx,key:recallStepKey,sel:JSON.parse(JSON.stringify(recallSel))});
    if(recallStepKey==='time') recallStepKey='scene';
    else if(recallStepKey==='scene') recallStepKey='cue';
    else if(recallStepKey==='cue') recallStepKey='note';
    renderRecallStep();
  };
  const pbr=document.getElementById('prevBtnRecall');
  if(pbr) pbr.onclick=goBackRecall;
  const sc=document.getElementById('skipCue');
  if(sc) sc.onclick=()=>{
    recallHistory.push({idx:recallStepIdx,key:recallStepKey,sel:JSON.parse(JSON.stringify(recallSel))});
    recallStepKey='note'; renderRecallStep();
  };
}
function finishRecallStep(){
  const item=RECALL_ITEMS[recallStepIdx];
  recallNotes[recallStepIdx]=buildPastNote(item, recallSel);
  recallStepIdx++;
  if(recallStepIdx>=RECALL_ITEMS.length){
    past = recallNotes.filter(Boolean);
    recallDone=true;
    renderGate(1);
  } else {
    recallStepKey='time';
    recallSel={time:null,scene:null,cues:[],note:''};
    renderRecallStep();
  }
}

function goBackRecall(){
  if(recallHistory.length===0){
    renderRecall();
    return;
  }
  const prev=recallHistory.pop();
  recallStepIdx=prev.idx;
  recallStepKey=prev.key;
  recallSel=JSON.parse(JSON.stringify(prev.sel));
  renderRecallStep();
}

function renderGate(g){
  currentGate=g;
  const m=GATE_META[g];
  stage.innerHTML=`
    <div class="gate">
      <div class="gno">${m.no}</div>
      <h2>${m.title}</h2>
      <div class="gsub">${m.sub}</div>
      <div class="gnote">${m.en} · ${m.note}</div>
      <button class="btn btn-primary" id="startGate">开始这一关 →</button>
    </div>`;
  plabel.textContent=`第 ${g} / 4 关`;
  document.getElementById('startGate').onclick=()=>renderQuestion();
  saveProgress('gate');
}

function updateProgress(){
  const done=idx;
  bar.style.width=(done/total*100)+'%';
  if(idx<total){
    const g=QUIZ[idx].gate;
    plabel.textContent=`第 ${g} / 4 关 · 第 ${countInGateBefore(g)+1} / ${countGate(g)} 题`;
  }
}

function renderQuestion(){
  const item=QUIZ[idx];
  currentGate=item.gate;
  const c = item.gate===1?'var(--sky)':item.gate===2?'var(--violet)':item.gate===3?'var(--mint)':'var(--gold)';
  const optsHtml=item.opts.map((o,i)=>`
    <button class="opt" style="--c:${c}" data-i="${i}">
      ${o.t}${o.tag?`<span class="tag">${o.tag}</span>`:''}
    </button>`).join('');
  const prevBtnHtml = idx>0 ? `<div class="prev-row"><button class="btn btn-ghost" id="prevBtn">← 上一条</button></div>` : '';
  stage.innerHTML=`
    <div class="q">
      <div class="qmeta">${GATE_META[item.gate].no} · ${GATE_META[item.gate].en}</div>
      <h3>${item.q}${item.why?` <button type="button" class="why-btn" aria-expanded="false" aria-label="为什么问这道">ⓘ</button>`:''}</h3>
      ${item.why?`<div class="why-pop" hidden>${item.why}</div>`:''}
      ${item.gate===4?`<div class="g4hint">认不出也别急——挑一个「最像你最近状态」的就好。这关只是确认你当下的坐标，没有标准答案。</div>`:''}
      <div class="opts">${optsHtml}</div>
      ${prevBtnHtml}
    </div>`;
  updateProgress();
  stage.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const o=item.opts[+b.dataset.i];
      const record={gate:item.gate, q:item.q, opt:o.t, deltas:{}};
      if(item.gate===4){
        record.qkey=item.qkey;
        record.prevNote=ikigai[item.qkey];
        record.note=o.note;
        ikigai[item.qkey]=o.note;
      } else {
        for(const k in o.s){ scores[k]=(scores[k]||0)+o.s[k]; record.deltas[k]=o.s[k]; }
      }
      history.push(record);
      idx++;
      if(idx>=total){ renderResult(); return; }
      if(QUIZ[idx].gate!==currentGate){ renderFeedback(currentGate); }
      else { renderQuestion(); }
    };
  });
  const pb=document.getElementById('prevBtn');
  if(pb) pb.onclick=goBack;
  const wb=stage.querySelector('.why-btn');
  if(wb){ wb.onclick=()=>{ const pop=stage.querySelector('.why-pop'); if(!pop) return; const open=!pop.hasAttribute('hidden'); pop.toggleAttribute('hidden'); wb.setAttribute('aria-expanded',String(open)); }; }
  saveProgress('question');
}

function goBack(){
  if(idx<=0 || history.length===0) return;
  const last=history.pop();
  idx--;
  for(const k in last.deltas){
    scores[k]-=last.deltas[k];
    if(scores[k]<=0) delete scores[k];
  }
  if(last.qkey){
    if(last.prevNote!==undefined) ikigai[last.qkey]=last.prevNote;
    else delete ikigai[last.qkey];
  }
  currentGate=QUIZ[idx].gate;
  renderQuestion();
}

function renderFeedback(g){
  const m=GATE_META[g];
  let body='', note='';
  if(g===1){
    const riaScores=Object.fromEntries(Object.entries(scores).filter(([k])=>RIA[k]));
    const top=topN(riaScores,3).filter(([k,v])=>v>0);
    const tags=top.map(([k,v])=>`<span class="top">${RIA[k]} · ${v}次</span>`).join('') || '<span>还不太明显</span>';
    body=`目前你手伸得最勤的方向是——`;
    note=`兴趣代码是「模式」，不是具体职业。不管你那件事看起来多小众，RIASEC 都能接住它。`;
    stage.innerHTML=`
      <div class="feedback gate">
        <div class="gno">${m.no} · 火候反馈</div>
        <h2>${m.title}</h2>
        <div class="gsub">${body}</div>
        <div class="mini-tags">${tags}</div>
        <button class="btn btn-primary" id="nextFromFeedback">继续下一关 →</button>
        <div class="fb-note">${note}</div>
      </div>`;
  } else if(g===2){
    const viaBlack=Object.keys(RIA).concat(FLOW_KEYS,SIG_KEYS,['充电','耗尽']);
    const viaEntries=Object.entries(scores).filter(([k])=>!viaBlack.includes(k));
    const top=topN(Object.fromEntries(viaEntries),5).filter(([k,v])=>v>0);
    const tags=top.map(([k,v])=>`<span class="top">${k}</span>`).join('') || '<span>还在观察中</span>';
    body=`你身上最亮的几道光——`;
    note=`如果刚才很多题你都感觉「两个都想选」，说明你的优势比较广谱，这不矛盾，只是你发光的维度不止一个。`;
    stage.innerHTML=`
      <div class="feedback gate">
        <div class="gno">${m.no} · 火候反馈</div>
        <h2>${m.title}</h2>
        <div class="gsub">${body}</div>
        <div class="mini-tags">${tags}</div>
        <button class="btn btn-primary" id="nextFromFeedback">继续下一关 →</button>
        <div class="fb-note">${note}</div>
      </div>`;
  } else if(g===3){
    const flowTop=topN(Object.fromEntries(FLOW_KEYS.map(k=>[k,scores[k]||0])),3).filter(([k,v])=>v>0);
    const sigTop=topN(Object.fromEntries(SIG_KEYS.map(k=>[k,scores[k]||0])),3).filter(([k,v])=>v>0).map(([k])=>SIG_NAME[k]);
    const charge=scores['充电']||0, drain=scores['耗尽']||0;
    const energyType = charge>drain+1 ? '充电型' : drain>charge+1 ? '耗尽型' : '看情况';
    const flowTags=flowTop.map(([k])=>`<span class="top">${k}</span>`).join('') || '<span>还在浮现</span>';
    const sigTags=sigTop.length? `<div class="mini-tags" style="margin-top:10px">${sigTop.map(s=>`<span>${s}</span>`).join('')}</div>` : '';
    body=`你最容易「消失」的状态——`;
    note=`能量上偏<b>${energyType}</b>。最后一关会看看它能不能当饭吃。`;
    stage.innerHTML=`
      <div class="feedback gate">
        <div class="gno">${m.no} · 火候反馈</div>
        <h2>${m.title}</h2>
        <div class="gsub">${body}</div>
        <div class="mini-tags">${flowTags}</div>
        ${sigTags}
        <button class="btn btn-primary" id="nextFromFeedback">继续下一关 →</button>
        <div class="fb-note">${note}</div>
      </div>`;
  }
  plabel.textContent=`第 ${g} 关 · 已完成`;
  bar.style.width=(QUIZ.filter(q=>q.gate<=g).length/total*100)+'%';
  document.getElementById('nextFromFeedback').onclick=()=>renderQuestion();
  saveProgress('feedback');
}

/* 按测评分数生成星图：三层簇的大小/数量/亮度随 Top 维度权重变化 */
function starMapSVG(ria, via, flow){
  const anchors=[[86,112],[234,112],[160,240]];
  const colors=['var(--sky)','var(--violet)','var(--mint)'];
  const lists=[ria||[],via||[],flow||[]];
  const weights=lists.map(list=>{
    if(!list.length) return 0.2;
    const max=Math.max(1,...list.map(x=>x.v!=null?x.v:(x[1]!=null?x[1]:1)));
    return ((list[0].v!=null?list[0].v:(list[0][1]!=null?list[0][1]:1))/max)||0.2;
  });
  let groups='';
  lists.forEach((list,gi)=>{
    const [cx,cy]=anchors[gi];
    const w=weights[gi];
    const max=Math.max(1,...list.map(x=>x.v!=null?x.v:(x[1]!=null?x[1]:1)));
    const n=Math.max(3,Math.min(7,list.length?list.length+2:3));
    const pts=[];
    for(let i=0;i<n;i++){
      const a=gi*2.1+i*2*Math.PI/n;
      const item=list[i]||null;
      const val=item?(item.v!=null?item.v:(item[1]!=null?item[1]:1)):0.4;
      const rr=26+(i%3)*6+(val/max)*20;
      pts.push({
        x:cx+Math.cos(a)*rr,
        y:cy+Math.sin(a)*rr*0.86,
        r:3.2+(val/max)*2.8,
        o:0.55+(val/max)*0.45
      });
    }
    const d=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    groups+=`<g class="grp" style="opacity:${(0.45+0.55*w).toFixed(2)}">
      <path d="${d}" fill="none" stroke="${colors[gi]}" stroke-width="1.4" stroke-dasharray="3 5"/>
      ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}" fill="${colors[gi]}" style="opacity:${p.o.toFixed(2)}"/>`).join('')}
    </g>`;
  });
  const avg=(weights[0]+weights[1]+weights[2])/3;
  return `<svg viewBox="0 0 320 320" role="img" aria-label="你的三层天赋星图">
    <circle cx="160" cy="160" r="130" fill="none" stroke="rgba(255,255,255,.07)"/>
    <circle cx="160" cy="160" r="85" fill="none" stroke="rgba(255,255,255,.07)"/>
    <circle cx="160" cy="160" r="45" fill="none" stroke="rgba(255,255,255,.07)"/>
    ${groups}
    <circle cx="160" cy="160" r="34" fill="rgba(243,193,75,${(0.10+avg*0.12).toFixed(2)})"/>
    <circle cx="160" cy="160" r="${(5.5+avg*2.5).toFixed(1)}" fill="#ffe1a0"/>
    <circle cx="160" cy="160" r="14" fill="none" stroke="rgba(243,193,75,${(0.35+avg*0.35).toFixed(2)})" stroke-width="1.2"/>
    <circle cx="160" cy="160" r="70" fill="none" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="4 8" style="opacity:${(0.35+avg*0.6).toFixed(2)}"/>
  </svg>`;
}

function renderResult(){
  bar.style.width='100%';
  plabel.textContent='星图已绘制';

  // 兴趣 Top3
  const riaScores=Object.fromEntries(Object.entries(scores).filter(([k])=>RIA[k]));
  const riaTop=topN(riaScores,3).map(([k,v])=>({k,label:RIA[k],v}));
  // 优势 Top5
  const viaBlack=Object.keys(RIA).concat(FLOW_KEYS,SIG_KEYS,['充电','耗尽']);
  const viaEntries=Object.entries(scores).filter(([k])=>!viaBlack.includes(k));
  const viaTop=topN(Object.fromEntries(viaEntries),5);
  // 心流最强信号
  const flowTop=topN(Object.fromEntries(FLOW_KEYS.map(k=>[k,scores[k]||0])),3).filter(([k,v])=>v>0);
  // 能量读数
  const charge=scores['充电']||0, drain=scores['耗尽']||0;
  const energyType = charge>drain+1 ? '充电型' : drain>charge+1 ? '耗尽型' : '看情况';
  // 五信号
  const signals=topN(Object.fromEntries(SIG_KEYS.map(k=>[k,scores[k]||0])),3).filter(([k,v])=>v>0).map(([k])=>SIG_NAME[k]);

  // —— A6：置信度（分数集中度）——
  const riaVals=Object.values(riaScores);
  const riaMax=Math.max(0,...riaVals), riaSum=riaVals.reduce((a,b)=>a+b,0);
  const riaConc = riaSum? riaMax/riaSum : 0;
  const viaVals=Object.values(Object.fromEntries(viaEntries));
  const viaMax=Math.max(0,...viaVals), viaSum=viaVals.reduce((a,b)=>a+b,0);
  const viaConc = viaSum? viaMax/viaSum : 0;
  const conc=(riaConc+viaConc)/2;
  let confLevel, confText;
  if(conc>0.42){ confLevel='稳'; confText='你的选择相当集中，这张星图比较能代表你当下的样子。'; }
  else if(conc>0.28){ confLevel='中等'; confText='轮廓有了，但还有几个方向在抢。隔阵子再来一次，会越画越清。'; }
  else { confLevel='初探'; confText='你似乎哪边都想试——这本身也是种天赋（广谱兴趣）。多测几次会更聚焦。'; }

  // —— B1：叙事化结论 ——
  const r1=riaTop[0]?riaTop[0].label:'还没聚焦';
  const v1=viaTop[0]?viaTop[0][0]:'某个还没命名的特质';
  const f1=flowTop[0]?flowTop[0][0]:'某件让你停不下来的事';
  const narrative=`如果只用一段话描摹你——你大概是个被 <b>${r1}</b> 吸着走的人：
    手会先伸向那一类的东西，哪怕说不清为什么。托着你的，是 <b>${v1}</b> 这样的特质，它让你在某些时刻比平时更"是你"。
    而真正让你消失的，常常是 <b>${f1}</b>——那种做完不是累、是满了的瞬间，就是天赋最老实的证据。
    你偏 <b>${energyType}</b>：同样的事，你更容易被它充电而不是耗尽。${signals.length?`别人常说你"${signals.join('、')}"，那不是客套，是信号。`:''}
    ${past.length?`你还记得：${past[0].slice(0,24)}……这些片段不是过去，是你天赋早就露过的光。`:''}
    三层叠在一起的那一小块，不一定壮观，但它是真的——而且不管你擅长的那件事看起来多冷门、多「没用」，这三层模式都能把它接住。`;

  const verdict=`你的天赋区，落在 <b>${r1}</b> 的方向上，被 <b>${v1}</b> 这样的特质托着，
    而让你真正"消失"的，常常是 <b>${f1}</b>。三层叠在一起的那一小块，不一定壮观，但它是真的——
    值得你拿去做点什么。`;

  // 存结果，供 report.html 读取
  const SRC_FROM=(new URLSearchParams(location.search).get('from'))||'';
  if(SRC_FROM){
    const L={bili:'B站',bili01:'B站',xhs:'小红书',xhs01:'小红书',dy:'抖音',dy01:'抖音',douyin:'抖音',wb:'微博',wb01:'微博',zh:'公众号',zh01:'公众号',video:'视频'};

    try{const k='talentmap_utm_'+SRC_FROM;localStorage.setItem(k,String((parseInt(localStorage.getItem(k)||'0',10)||0)+1));}catch(e){}
  }

  const payload={
    riaTop, viaTop, flowTop,
    energy:{type:energyType,charge,drain},
    signals,
    ikigai, past,
    confidence:{level:confLevel,text:confText},
    narrative, verdict, ts:Date.now(), from:SRC_FROM,
    trail:JSON.parse(JSON.stringify(history))
  };
  try{ localStorage.setItem('talentmap_result', JSON.stringify(payload)); }catch(e){}
  if(window.tmTrack) tmTrack('quiz_complete'); // Umami 漏斗：完成测评
  // ② 多次测评对比：把本次结果追加进历史（最多留 6 张）
  try{
    let h=[]; try{ h=JSON.parse(localStorage.getItem('talentmap_history'))||[]; }catch(e){}
    if(!h.length || h[h.length-1].ts!==payload.ts){
      h.push(JSON.parse(JSON.stringify(payload)));
      if(h.length>6) h=h.slice(-6);
      localStorage.setItem('talentmap_history', JSON.stringify(h));
    }
  }catch(e){}
  clearProgress();

  const riaTags=riaTop.map(r=>`<span class="top">${r.label}</span>`).join('')||'<span>暂不明显</span>';
  const viaTags=viaTop.map(([k])=>`<span class="top">${k}</span>`).join('')||'<span>暂不明显</span>';
  const flowTags=flowTop.map(([k])=>`<span class="top">${k}</span>`).join('')||'<span>暂不明显</span>';

  stage.innerHTML=`
    <div class="result">
      <h2>你的天赋星图</h2>
      <div class="rsub">三层已经叠好，重合的那块，就是你的天赋区</div>
      <div class="map">
        ${starMapSVG(riaTop, viaTop, flowTop)}
      </div>
      <div class="groups">
        <div class="gcard">
          <div class="gh"><span class="dotc" style="background:var(--sky)"></span><h4>兴趣 · 你被什么吸走</h4><span class="en">RIASEC</span></div>
          <div class="tags">${riaTags}</div>
        </div>
        <div class="gcard">
          <div class="gh"><span class="dotc" style="background:var(--violet)"></span><h4>优势 · 你身上什么在漏光</h4><span class="en">VIA</span></div>
          <div class="tags">${viaTags}</div>
        </div>

          <div class="tags">${flowTags}</div>
        </div>
      </div>

      <div class="actions">

      </div>
      <div class="disclaim">说明：本测评用于自我探索与方向参考，基于 RIASEC、VIA、心流、IKIGAI 等心理学框架简化而来，不构成职业或心理诊断。它不判断具体技能（有人擅长整理、有人擅长猜人心、有人擅长把复杂变简单），只帮你识别那些技能背后的模式。结果越贴近你的真实体验，参考价值越高。</div>
    </div>`;
  document.getElementById('toReport').onclick=()=>{location.href='report.html'+(SRC_FROM?('?from='+encodeURIComponent(SRC_FROM)):'');};
}

/* 启动：有未完成的进度 → 弹「继续 / 重测」；否则从头开始 */
function showResumeBanner(s){
  let leftTxt='';
  if(s.phase==='recall-step'){
    const done=s.recallStepIdx||0; leftTxt=`回想 ${Math.min(done+1,3)} / 3 步 · 继续回忆`;
  } else if(s.phase==='recall-intro'){
    leftTxt='刚开始 · 继续回想';
  } else {
    const left=Math.max(0,total-(s.idx||0));
    leftTxt=`还剩 ${left} 题`;
  }
  stage.innerHTML=`
    <div class="gate resume">
      <div class="gno">上次没画完</div>
      <h2>继续你的星图？</h2>
      <div class="gsub">${leftTxt}。进度只存在你这台设备，关掉也不会丢。</div>
      <div style="text-align:center;margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="resumeBtn">继续画 →</button>
        <button class="btn btn-ghost" id="restartBtn">重新测一次</button>
      </div>
      <div class="gnote" style="margin-top:18px">选「重新测一次」会清空这次进度，从第一关开始。</div>
    </div>`;
  document.getElementById('resumeBtn').onclick=()=>{
    restoreProgress(s);
    if(s.phase==='recall-step') renderRecallStep();
    else if(s.phase==='gate') renderGate(currentGate);
    else if(s.phase==='question') renderQuestion();
    else if(s.phase==='feedback') renderFeedback(currentGate);
    else renderRecall();
    window.scrollTo(0,0);
  };
  document.getElementById('restartBtn').onclick=()=>{ clearProgress(); renderRecall(); window.scrollTo(0,0); };
}
(function boot(){
  const saved=loadProgress();
  if(saved && saved.phase && saved.phase!=='result'){ showResumeBanner(saved); }
  else { renderRecall(); }
})();
